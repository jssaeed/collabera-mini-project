$kind: http-request
url: "{{baseUrl}}/accounts/"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('includes the account just created', () => {
        const ids = body.accounts.map(a => a.account_id);
        pm.expect(ids).to.include(pm.collectionVariables.get('createdAccountId'));
      });
    language: text/javascript
order: 2000
