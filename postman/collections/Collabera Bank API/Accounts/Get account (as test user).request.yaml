$kind: http-request
url: "{{baseUrl}}/accounts/{{createdAccountId}}/"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('account_id matches', () => pm.expect(body.account_id).to.eql(pm.collectionVariables.get('createdAccountId')));
    language: text/javascript
order: 3000
