$kind: http-request
url: "{{baseUrl}}/accounts/{{createdAccountId}}/withdraw/"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "amount": 999999
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
