$kind: http-request
url: "{{baseUrl}}/auth/me/"
method: GET
headers:
  Authorization: Bearer {{adminAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('kind is admin', () => pm.expect(body.kind).to.eql('admin'));
    language: text/javascript
order: 10000
