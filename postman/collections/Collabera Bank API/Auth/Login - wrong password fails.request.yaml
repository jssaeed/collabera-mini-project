$kind: http-request
url: "{{baseUrl}}/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{testUserEmail}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
