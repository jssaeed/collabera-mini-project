$kind: http-request
url: "{{baseUrl}}/users/"
method: GET
headers:
  Authorization: Bearer {{adminAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('response has a users array', () => pm.expect(body.users).to.be.an('array'));
    language: text/javascript
order: 1000
